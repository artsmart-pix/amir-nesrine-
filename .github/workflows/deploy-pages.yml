name: Deploy to GitHub Pages

# Publie le contenu du dossier A-PUBLIER/ sur GitHub Pages
# a chaque push sur main (ou manuellement depuis l'onglet Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site (A-PUBLIER)
        uses: actions/upload-pages-artifact@v3
        with:
          path: A-PUBLIER

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
